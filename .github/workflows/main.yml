name: deploy

permissions: write-all

on: 
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: dependencies
        run: npm ci
      - name: build
        run: npm run build

      - name: config
        uses: actions/configure-pages@v4
      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: deploy
        uses: actions/deploy-pages@v4
